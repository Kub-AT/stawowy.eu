<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#50fa7b" opacity="0.06"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#282a36"/>
      <stop offset="100%" stop-color="#1e2030"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#bd93f9" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#50fa7b" stop-opacity="0.04"/>
    </linearGradient>
    <!-- fade out code text on right -->
    <linearGradient id="rfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="70%"  stop-color="#282a36" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1e2030" stop-opacity="0.95"/>
    </linearGradient>
    <!-- fade out left (photo area) -->
    <linearGradient id="lfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#282a36" stop-opacity="0.5"/>
      <stop offset="20%" stop-color="#282a36" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#glow)"/>
  <rect width="1584" height="396" fill="url(#dots)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="5" height="396" fill="#50fa7b" opacity="0.9"/>

  <!-- decorative code — left side, partially hidden by photo, that's fine -->
  <text x="60"  y="100" font-family="monospace" font-size="13" fill="#44475a" opacity="0.5">def build_reliable_systems():</text>
  <text x="76"  y="122" font-family="monospace" font-size="13" fill="#44475a" opacity="0.4">    return scalable, tested, boring_in_the_best_way</text>
  <text x="60"  y="158" font-family="monospace" font-size="13" fill="#44475a" opacity="0.35">class BackendEngineer:</text>
  <text x="76"  y="180" font-family="monospace" font-size="13" fill="#44475a" opacity="0.3">    stack = ["Python", "Django", "FastAPI", "Docker", "AWS"]</text>
  <text x="76"  y="202" font-family="monospace" font-size="13" fill="#44475a" opacity="0.2">    location = "Poznań / Remote"</text>
  <text x="60"  y="238" font-family="monospace" font-size="13" fill="#44475a" opacity="0.2"># early-stage engineer @ bugbug.io</text>
  <text x="60"  y="274" font-family="monospace" font-size="13" fill="#44475a" opacity="0.15">jakub@stawowy.eu:~$ _</text>

  <rect width="1584" height="396" fill="url(#rfade)"/>
  <rect width="1584" height="396" fill="url(#lfade)"/>

  <!-- main text — center/right, safe from photo -->
  <text x="792" y="158" font-family="monospace" font-size="58" font-weight="bold" fill="#f8f8f2" text-anchor="middle">Jakub Stawowy</text>
  <text x="792" y="210" font-family="monospace" font-size="26" fill="#50fa7b" text-anchor="middle">Software Engineer</text>

  <!-- bottom -->
  <text x="792" y="348" font-family="monospace" font-size="15" fill="#6272a4" text-anchor="middle">stawowy.eu</text>
</svg>
